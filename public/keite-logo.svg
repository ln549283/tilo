<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">KEITE — Keep It Even</title>
  <desc id="desc">Logo KEITE arqué violet, losange vert intégré au I, ombre douce et traits décoratifs latéraux.</desc>
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C68FF"/>
      <stop offset="0.55" stop-color="#7B43F3"/>
      <stop offset="1" stop-color="#6335DC"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67EB79"/>
      <stop offset="1" stop-color="#2AC95C"/>
    </linearGradient>
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="11" stdDeviation="8" flood-color="#5B37C9" flood-opacity="0.23"/>
    </filter>
    <filter id="shapeShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4C2FC0" flood-opacity="0.20"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)" fill="url(#purple)" font-family="Arial Rounded MT Bold, Nunito, Quicksand, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="215" y="246" font-size="190" transform="rotate(-3 215 246)">K</text>
    <text x="390" y="218" font-size="178" transform="rotate(-1 390 218)">E</text>
    <text x="675" y="218" font-size="178" transform="rotate(1 675 218)">T</text>
    <text x="835" y="246" font-size="190" transform="rotate(3 835 246)">E</text>
  </g>

  <g filter="url(#shapeShadow)">
    <circle cx="535" cy="72" r="42" fill="url(#purple)"/>
    <rect x="493" y="126" width="84" height="84" rx="20" transform="rotate(45 535 168)" fill="url(#green)"/>
  </g>

  <g fill="#C5A8FF">
    <rect x="68" y="158" width="56" height="13" rx="7" transform="rotate(27 68 158)"/>
    <rect x="60" y="210" width="58" height="13" rx="7" transform="rotate(-15 60 210)"/>
    <rect x="876" y="158" width="56" height="13" rx="7" transform="rotate(-27 876 158)"/>
    <rect x="882" y="210" width="58" height="13" rx="7" transform="rotate(15 882 210)"/>
  </g>

  <text x="500" y="330" text-anchor="middle" font-family="Arial Rounded MT Bold, Nunito, Quicksand, Arial, sans-serif" font-size="39" font-weight="700" letter-spacing="11" fill="#57516D">KEEP IT EVEN</text>
</svg>