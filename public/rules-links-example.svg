<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 118" role="img" aria-label="Exemple visuel identique et différent">
  <rect width="320" height="118" rx="18" fill="#f7f6fb"/>

  <g transform="translate(12 0)">
    <text x="72" y="24" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#777985" letter-spacing="1.1">IDENTIQUE</text>
    <rect x="0" y="34" width="48" height="58" rx="14" fill="#ececf2"/>
    <circle cx="24" cy="63" r="15" fill="#7c4dff"/>
    <rect x="57" y="51" width="30" height="24" rx="8" fill="#eee9ff" stroke="#a78dfb" stroke-width="2"/>
    <text x="72" y="68" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="900" fill="#7042ef">=</text>
    <rect x="96" y="34" width="48" height="58" rx="14" fill="#ececf2"/>
    <circle cx="120" cy="63" r="15" fill="#7c4dff"/>
  </g>

  <g transform="translate(164 0)">
    <text x="72" y="24" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#777985" letter-spacing="1.1">DIFFÉRENT</text>
    <rect x="0" y="34" width="48" height="58" rx="14" fill="#ececf2"/>
    <rect x="14" y="49" width="20" height="20" rx="5" transform="rotate(45 24 59)" fill="#35c98f"/>
    <rect x="57" y="51" width="30" height="24" rx="8" fill="#e8fbf3" stroke="#35c98f" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="72" y="68" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="900" fill="#16845f">×</text>
    <rect x="96" y="34" width="48" height="58" rx="14" fill="#ececf2"/>
    <circle cx="120" cy="63" r="15" fill="#7c4dff"/>
  </g>
</svg>